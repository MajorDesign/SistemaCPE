  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* =====================================================================
       DASHBOARD — refresh visual seguindo a linguagem CPE Control
       (preto + amarelo, papel quente, DM Sans, hairlines técnicos).
       Estilos LOCAIS desta página — não afeta outras telas.
       ===================================================================== */

    /* Aplica DM Sans só dentro do conteúdo da dashboard (sem mexer no body
       global, que outras páginas podem assumir). */
    .main-content,
    .main-content h1,
    .main-content h2,
    .main-content h3,
    .dash-saudacao,
    .kpi-card,
    .dash-panel,
    .atalho-btn,
    .reserva-banner,
    .agenda-hora,
    .frota-mini .v,
    .aval-media-circle {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    }
    .main-content { -webkit-font-smoothing: antialiased; }

    /* ---------- Saudação ---------- */
    .dash-saudacao {
      font-size: 15px;
      color: #5C6370;
      margin: 0 0 22px;
      letter-spacing: -.005em;
    }
    .dash-saudacao strong {
      color: #0F1419; font-weight: 700;
    }
    .dash-saudacao .role-badge {
      background: #1A1A1A; color: #FFC107;
      padding: 3px 10px; border-radius: 2px;
      font-size: 10px; font-weight: 600;
      margin-left: 10px;
      text-transform: uppercase; letter-spacing: .12em;
    }

    /* ---------- KPI Grid: cards técnicos, hairline amarelo no hover ---------- */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1px;
      background: #D8D5C8;
      border: 1px solid #D8D5C8;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 26px;
    }
    .kpi-card {
      background: #fff;
      border: none;
      border-radius: 0;
      padding: 20px 22px;
      transition: background .18s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      position: relative;
    }
    .kpi-card::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px; background: #FFC107;
      transform: scaleX(0); transform-origin: left;
      transition: transform .25s ease;
    }
    .kpi-card:hover {
      background: #FAF8F2;
      text-decoration: none;
      transform: none;
      box-shadow: none;
    }
    .kpi-card:hover::before { transform: scaleX(1); }
    .kpi-card.color-success::before { background: #1B7F4E; }
    .kpi-card.color-warning::before { background: #B8870B; }
    .kpi-card.color-danger::before  { background: #C0392B; }
    .kpi-card.color-info::before    { background: #1D4ED8; }

    .kpi-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 4px;
      background: transparent; color: #5C6370;
      font-size: 18px; margin-bottom: 12px;
      border: 1px solid #D8D5C8;
    }
    .kpi-card.color-success .kpi-icon { color: #1B7F4E; border-color: rgba(27,127,78,.3); }
    .kpi-card.color-warning .kpi-icon { color: #B8870B; border-color: rgba(184,135,11,.3); }
    .kpi-card.color-danger  .kpi-icon { color: #C0392B; border-color: rgba(192,57,43,.3); }
    .kpi-card.color-info    .kpi-icon { color: #1D4ED8; border-color: rgba(29,78,216,.3); }

    .kpi-label {
      font-size: 11px; color: #5C6370; font-weight: 600;
      text-transform: uppercase; letter-spacing: .1em;
    }
    .kpi-value {
      font-size: 2.4rem; font-weight: 800; color: #0F1419;
      line-height: 1; margin: 6px 0 6px;
      letter-spacing: -.025em;
      font-variant-numeric: tabular-nums;
    }
    .kpi-subtitle { font-size: 12px; color: #5C6370; }

    /* ---------- Linha: agenda + pendências ---------- */
    .dash-row {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 16px;
      margin-bottom: 26px;
    }
    @media (max-width: 900px) { .dash-row { grid-template-columns: 1fr; } }

    .dash-panel {
      background: #fff;
      border: 1px solid #D8D5C8;
      border-radius: 4px;
      padding: 20px 22px;
      position: relative;
    }
    .dash-panel-title {
      font-size: 1rem; font-weight: 600; color: #0F1419;
      letter-spacing: -.01em;
      margin: 0 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #D8D5C8;
      display: flex; align-items: center; gap: 10px;
    }
    .dash-panel-title .badge {
      margin-left: auto;
      background: transparent;
      color: #5C6370;
      font-size: 10px; padding: 3px 8px;
      border-radius: 2px;
      border: 1px solid #D8D5C8;
      font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Agenda items ---------- */
    .agenda-item {
      display: flex; gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid #ECEAE0;
    }
    .agenda-item:last-child { border-bottom: 0; padding-bottom: 0; }
    .agenda-hora {
      flex-shrink: 0;
      font-weight: 700; font-size: 15px;
      color: #0F1419;
      width: 56px; text-align: right;
      letter-spacing: -.01em;
      font-variant-numeric: tabular-nums;
    }
    .agenda-hora .ate {
      display: block; font-size: 11px; color: #9CA3AF;
      font-weight: 500; margin-top: 2px;
    }
    .agenda-info-titulo { font-weight: 600; font-size: 14px; color: #0F1419; }
    .agenda-info-local  { font-size: 12px; color: #5C6370; margin-top: 3px; }

    /* ---------- Pendência items ---------- */
    .pendencia-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 14px;
      border-radius: 2px;
      margin-bottom: 6px;
      background: #fff;
      border: 1px solid #D8D5C8;
      border-left: 3px solid #9CA3AF;
      text-decoration: none;
      color: inherit;
      transition: padding-left .15s, border-left-width .15s;
    }
    .pendencia-item:hover {
      text-decoration: none;
      padding-left: 18px;
      border-left-width: 4px;
    }
    .pendencia-item.urgencia-alta  { border-left-color: #C0392B; }
    .pendencia-item.urgencia-media { border-left-color: #FFC107; }
    .pendencia-icon { font-size: 18px; color: #5C6370; flex-shrink: 0; margin-top: 2px; }
    .pendencia-item.urgencia-alta  .pendencia-icon { color: #C0392B; }
    .pendencia-item.urgencia-media .pendencia-icon { color: #B8870B; }
    .pendencia-label { font-size: 13px; line-height: 1.5; flex: 1; color: #0F1419; }

    /* ---------- Estado vazio ---------- */
    .dash-empty {
      text-align: center; padding: 32px 16px;
      color: #5C6370; font-size: 13px;
    }
    .dash-empty i {
      font-size: 28px; display: block; margin-bottom: 10px;
      opacity: .4;
    }

    /* ---------- Atalhos rápidos: pill preto+amarelo ---------- */
    .atalhos-bar {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-bottom: 26px;
    }
    .atalho-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px;
      background: #fff; border: 1px solid #D8D5C8;
      border-radius: 4px;
      font-size: 13px; font-weight: 600; color: #0F1419;
      text-decoration: none;
      transition: background .15s, border-color .15s, color .15s;
    }
    .atalho-btn:hover {
      background: #1A1A1A; color: #FFC107;
      border-color: #1A1A1A; text-decoration: none;
    }
    .atalho-btn i { font-size: 15px; color: #B8870B; transition: color .15s; }
    .atalho-btn:hover i { color: #FFC107; }

    /* ---------- Banner de próxima reserva — paleta CPE (preto+amarelo) ---------- */
    .reserva-banner {
      display: flex; align-items: center; gap: 14px;
      background: #1A1A1A; color: #fff;
      border: 1px solid #1A1A1A;
      border-radius: 4px;
      padding: 16px 20px;
      margin-bottom: 26px;
      text-decoration: none;
      transition: transform .15s, box-shadow .15s;
      position: relative;
      overflow: hidden;
    }
    .reserva-banner::before {
      /* faixa amarela à esquerda — assinatura CPE */
      content: ''; position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px; background: #FFC107;
    }
    .reserva-banner:hover {
      text-decoration: none;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(15,20,25,.18);
    }
    .reserva-banner .icon {
      flex-shrink: 0; width: 44px; height: 44px;
      border-radius: 4px;
      background: rgba(255,193,7,.15); color: #FFC107;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      border: 1px solid rgba(255,193,7,.3);
    }
    .reserva-banner .titulo { font-weight: 700; color: #fff; font-size: 14px; }
    .reserva-banner .meta {
      font-size: 12px; color: rgba(255,255,255,.65); margin-top: 3px;
    }
    .reserva-banner .meta i { margin-right: 4px; color: #FFC107; }
    .reserva-banner .data-block {
      flex-shrink: 0; text-align: right;
      font-weight: 700; color: #FFC107;
    }
    .reserva-banner .data-block .hora {
      font-size: 20px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em;
    }
    .reserva-banner .data-block .dia {
      font-size: 11px; color: rgba(255,255,255,.55); font-weight: 500;
      text-transform: uppercase; letter-spacing: .08em;
      margin-top: 2px;
    }

    /* ---------- Avaliações ---------- */
    .aval-resumo { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
    .aval-media-circle {
      flex-shrink: 0; width: 72px; height: 72px;
      border-radius: 4px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #fff; font-weight: 800;
      letter-spacing: -.02em;
    }
    .aval-media-circle.bom     { background: #1B7F4E; }
    .aval-media-circle.regular { background: #B8870B; color: #1A1A1A; }
    .aval-media-circle.ruim    { background: #C0392B; }
    .aval-media-circle .num    { font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
    .aval-media-circle .max    { font-size: 10px; opacity: .85; font-weight: 500; margin-top: 2px; }
    .aval-media-info { flex: 1; }
    .aval-media-info .total { font-size: 13px; color: #5C6370; line-height: 1.5; }
    .aval-media-info .total strong { color: #0F1419; }
    .aval-bar-row {
      display: flex; align-items: center; gap: 10px;
      font-size: 12px; margin-top: 8px;
    }
    .aval-bar-row .lbl { width: 70px; color: #5C6370; font-weight: 600; }
    .aval-bar-row .qtd {
      width: 38px; text-align: right; color: #5C6370;
      font-variant-numeric: tabular-nums;
    }
    .aval-bar { flex: 1; height: 6px; background: #ECEAE0; border-radius: 2px; overflow: hidden; }
    .aval-bar > div { height: 100%; transition: width .4s; }
    .aval-bar.pos > div { background: #1B7F4E; }
    .aval-bar.neu > div { background: #B8870B; }
    .aval-bar.neg > div { background: #C0392B; }

    /* ---------- Widget Frota (mini-grid) ---------- */
    .frota-mini-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: #D8D5C8;
      border: 1px solid #D8D5C8;
      border-radius: 4px;
      overflow: hidden;
    }
    .frota-mini {
      background: #fff;
      padding: 14px 12px;
      text-align: center;
    }
    .frota-mini .v {
      font-size: 24px; font-weight: 800; color: #0F1419;
      line-height: 1;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
    }
    .frota-mini .l {
      font-size: 10px; color: #5C6370; margin-top: 6px;
      text-transform: uppercase; letter-spacing: .1em;
      font-weight: 600;
    }
    .frota-prox-manut {
      margin-top: 14px; padding: 12px 14px;
      background: rgba(255,193,7,.1);
      border: 1px solid rgba(255,193,7,.3);
      border-left: 3px solid #FFC107;
      border-radius: 2px;
      font-size: 13px; color: #0F1419;
      line-height: 1.5;
    }
    .frota-prox-manut strong { color: #0F1419; font-weight: 700; }
    .frota-prox-manut.urgente {
      background: rgba(192,57,43,.06);
      border-color: rgba(192,57,43,.3);
      border-left-color: #C0392B;
      color: #0F1419;
    }
    .frota-prox-manut.urgente strong { color: #C0392B; }
    .frota-prox-manut i { color: #B8870B; margin-right: 4px; }
    .frota-prox-manut.urgente i { color: #C0392B; }

    @media (max-width: 600px) {
      .frota-mini-grid { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: 1fr; }
      .kpi-value { font-size: 2rem; }
      .dash-saudacao .role-badge { display: inline-block; margin-top: 4px; margin-left: 0; }
      .reserva-banner { flex-wrap: wrap; }
      .reserva-banner .data-block { text-align: left; margin-top: 4px; }
    }

    /* ---------- Movimento sutil: stagger nos KPIs ---------- */
    .kpi-card,
    .dash-panel,
    .reserva-banner,
    .atalho-btn,
    .agenda-item,
    .pendencia-item {
      opacity: 0;
      transform: translateY(6px);
      animation: dashEnter .42s cubic-bezier(.2,.8,.2,1) forwards;
    }
    .kpi-card:nth-child(1) { animation-delay: .04s; }
    .kpi-card:nth-child(2) { animation-delay: .08s; }
    .kpi-card:nth-child(3) { animation-delay: .12s; }
    .kpi-card:nth-child(4) { animation-delay: .16s; }
    .atalho-btn:nth-child(2) { animation-delay: .04s; }
    .atalho-btn:nth-child(3) { animation-delay: .08s; }
    .atalho-btn:nth-child(4) { animation-delay: .12s; }
    .reserva-banner { animation-delay: .2s; }
    .dash-row .dash-panel:nth-child(1) { animation-delay: .22s; }
    .dash-row .dash-panel:nth-child(2) { animation-delay: .26s; }
    @keyframes dashEnter {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .kpi-card, .dash-panel, .reserva-banner, .atalho-btn,
      .agenda-item, .pendencia-item {
        animation: none; opacity: 1; transform: none;
      }
    }
  </style>

  <!-- 🔐 INICIALIZAÇÃO PÓS-AUTENTICAÇÃO -->
  <script>
    /**
     * 🎬 INICIALIZAÇÃO DO DASHBOARD
     * Aguarda o evento authenticationSuccess disparado pelo page-guard.js
     */

    console.log("\n" + "=".repeat(80));
    console.log("[INDEX] Aguardando autenticação...");
    console.log("=".repeat(80) + "\n");

    // [INICIO] Event Listener: authenticationSuccess
    document.addEventListener("authenticationSuccess", (e) => {
      const user = e.detail?.user;

      if (!user) {
        console.error("[INDEX] ❌ Usuário não encontrado no evento de autenticação");
        return;
      }

      console.log("\n" + "=".repeat(80));
      console.log("[INDEX] 🎬 INICIALIZANDO DASHBOARD");
      console.log("=".repeat(80));
      console.log(`[INDEX] 👤 Usuário: ${user.name}`);
      console.log(`[INDEX] 📧 Email: ${user.email}`);
      console.log(`[INDEX] 🎭 Role: ${user.role}`);
      console.log(`[INDEX] 🆔 ID: ${user.id}`);

      // ====================================
      // VERIFICAR PERMISSÕES
      // ====================================
      if (window.authProtection?.hasRole) {
        if (window.authProtection.hasRole("ADMIN")) {
          console.log("[INDEX] ✅ Acesso como ADMIN - Todos os dados visíveis");
        } else if (window.authProtection.hasRole("MANAGER")) {
          console.log("[INDEX] ℹ️  Acesso como MANAGER - Dados restritos");
        } else {
          console.log("[INDEX] ℹ️  Acesso como USER - Visão limitada");
        }
      } else {
        console.warn("[INDEX] ⚠️  Objeto authProtection não encontrado");
      }

      // ====================================
      // INICIALIZAR COMPONENTES
      // ====================================
      try {
        // Mostrar container principal
        const containerMain = document.querySelector(".container-main");
        const loadingPage = document.getElementById("loadingPage");

        if (containerMain) {
          containerMain.style.display = "flex";
          console.log("[INDEX] ✓ Container principal exibido");
        }

        if (loadingPage) {
          loadingPage.style.display = "none";
          console.log("[INDEX] ✓ Loading page ocultada");
        }

        setupMenuToggle();
        setActiveMenu();
        loadDashboardData(user);
        
        console.log("[INDEX] ✅ Dashboard inicializado com sucesso!");
        console.log("=".repeat(80) + "\n");

      } catch (err) {
        console.error("[INDEX] ❌ Erro na inicialização:", err.message);
        console.error("[INDEX] Stack:", err.stack);
        showError("Erro ao inicializar dashboard", err.message);
      }
    });
    // [FIM] Event Listener: authenticationSuccess

    // [INICIO] Fallback: Se não houver autenticação após 5 segundos
    setTimeout(() => {
      const loadingPage = document.getElementById("loadingPage");
      if (loadingPage && loadingPage.style.display !== "none") {
        console.warn("[INDEX] ⚠️  Autenticação não completada em 5 segundos");
        showError(
          "Erro de Autenticação",
          "Não conseguimos verificar suas credenciais. Tente fazer login novamente."
        );
      }
    }, 5000);
    // [FIM] Fallback

    // ====================================
    // FUNÇÃO: Setup Menu Toggle
    // ====================================
    // [INICIO] setupMenuToggle()
    // ⚠️ O bind do botão #menuToggle agora é feito dentro do nav.js
    //    (setupGlobalMenuToggle), que roda automaticamente depois que
    //    a sidebar é renderizada. Mantido aqui só pra log de início.
    function setupMenuToggle() {
      console.log("[INDEX] ℹ️  Menu toggle gerenciado pelo nav.js");
    }
    // [FIM] setupMenuToggle()

    // ====================================
    // FUNÇÃO: Marcar Menu Ativo
    // ====================================
    // [INICIO] setActiveMenu()
    function setActiveMenu() {
      try {
        const dashboardLink = document.querySelector('a[href*="index.html"]');
        if (dashboardLink) {
          // Remover classe active de todos os links
          document.querySelectorAll(".sidebar a").forEach(link => {
            link.classList.remove("active");
            link.parentElement?.classList.remove("active");
          });

          // Adicionar ao dashboard
          dashboardLink.classList.add("active");
          dashboardLink.parentElement?.classList.add("active");
          console.log("[INDEX] ✓ Menu Dashboard marcado como ativo");
        } else {
          console.warn("[INDEX] ⚠️  Link do dashboard não encontrado");
        }
      } catch (err) {
        console.warn("[INDEX] ⚠️  Erro ao marcar menu ativo:", err.message);
      }
    }
    // [FIM] setActiveMenu()

    // ====================================
    // FUNÇÃO: Carregar Dados do Dashboard
    // ====================================
    // [INICIO] loadDashboardData() — chama /api/dashboard/me
    // Retorna KPIs, agenda do dia, pendências e atalhos adaptados ao
    // role do usuário (USER / RESPONSAVEL_GRUPO / ADMIN / TI).
    // ====================================
    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
      }[c]));
    }

    async function loadDashboardData(user) {
      console.log("[INDEX] 📊 Carregando dashboard de", user.name);
      const apiBase = (typeof API_BASE_URL !== 'undefined')
        ? API_BASE_URL
        : `http://${location.hostname || '127.0.0.1'}:8000`;

      try {
        const r = await fetch(`${apiBase}/api/dashboard/me?user_id=${user.id}`);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const data = await r.json();

        renderSaudacao(data);
        renderKpis(data.kpis || []);
        renderAtalhos(data.atalhos || []);
        renderAgenda(data.agenda || []);
        renderPendencias(data.pendencias || []);
        renderProximaReserva(data.proxima_reserva);
        renderAvaliacoes(data.avaliacoes);
        renderFrota(data.frota);

        console.log("[INDEX] ✓ Dashboard carregada");
      } catch (err) {
        console.error("[INDEX] ❌ Erro ao carregar dashboard:", err);
        document.getElementById('dashKpis').innerHTML =
          `<div class="dash-empty" style="grid-column:1/-1">
            <i class="bi bi-exclamation-triangle"></i>
            Não foi possível carregar a dashboard. Tente recarregar a página.
          </div>`;
      }
    }

    function renderSaudacao(data) {
      const el = document.getElementById('dashSaudacao');
      el.innerHTML =
        `<strong>${escapeHtml(data.saudacao || 'Olá')}</strong>` +
        (data.role_label ? `<span class="role-badge">${escapeHtml(data.role_label)}</span>` : '');
    }

    function renderKpis(kpis) {
      const grid = document.getElementById('dashKpis');
      if (!kpis.length) {
        grid.innerHTML = '<div class="dash-empty" style="grid-column:1/-1"><i class="bi bi-bar-chart"></i>Sem indicadores configurados.</div>';
        return;
      }
      grid.innerHTML = kpis.map(k => {
        const cls = `kpi-card color-${k.color || 'default'}`;
        const tag = k.link ? 'a' : 'div';
        const href = k.link ? `href="${escapeHtml(k.link)}"` : '';
        return `
          <${tag} class="${cls}" ${href}>
            <span class="kpi-icon"><i class="bi ${escapeHtml(k.icon || 'bi-info-circle')}"></i></span>
            <div class="kpi-label">${escapeHtml(k.label)}</div>
            <div class="kpi-value">${escapeHtml(String(k.value))}</div>
            <div class="kpi-subtitle">${escapeHtml(k.subtitle || '')}</div>
          </${tag}>
        `;
      }).join('');
    }

    function renderAtalhos(atalhos) {
      const bar = document.getElementById('dashAtalhos');
      if (!atalhos.length) { bar.style.display = 'none'; return; }
      bar.innerHTML = atalhos.map(a => `
        <a class="atalho-btn" href="${escapeHtml(a.url)}">
          <i class="bi ${escapeHtml(a.icon || 'bi-plus-lg')}"></i>
          ${escapeHtml(a.label)}
        </a>
      `).join('');
    }

    function renderAgenda(eventos) {
      const cont  = document.getElementById('dashAgenda');
      const count = document.getElementById('dashAgendaCount');
      count.textContent = eventos.length;

      if (!eventos.length) {
        cont.innerHTML = `
          <div class="dash-empty">
            <i class="bi bi-calendar-x"></i>
            Nenhum compromisso hoje.
          </div>`;
        return;
      }
      cont.innerHTML = eventos.map(ev => `
        <div class="agenda-item">
          <div class="agenda-hora">
            ${escapeHtml(ev.hora || '')}
            ${ev.fim ? `<span class="ate">${escapeHtml(ev.fim)}</span>` : ''}
          </div>
          <div>
            <div class="agenda-info-titulo">${escapeHtml(ev.titulo || 'Compromisso')}</div>
            <div class="agenda-info-local"><i class="bi bi-geo-alt"></i> ${escapeHtml(ev.local || '—')}</div>
          </div>
        </div>
      `).join('');
    }

    function renderPendencias(pendencias) {
      const cont  = document.getElementById('dashPendencias');
      const count = document.getElementById('dashPendCount');
      count.textContent = pendencias.length;

      if (!pendencias.length) {
        cont.innerHTML = `
          <div class="dash-empty">
            <i class="bi bi-check-circle"></i>
            Nada pendente. Tudo em dia!
          </div>`;
        return;
      }
      cont.innerHTML = pendencias.map(p => `
        <a class="pendencia-item urgencia-${escapeHtml(p.urgencia || 'media')}"
           href="${escapeHtml(p.url || '#')}">
          <i class="bi ${escapeHtml(p.icon || 'bi-exclamation-circle')} pendencia-icon"></i>
          <div class="pendencia-label">${escapeHtml(p.label)}</div>
        </a>
      `).join('');
    }

    // ---- Banner: próxima reserva de sala (todos os roles) -----------
    function renderProximaReserva(r) {
      const banner = document.getElementById('dashReservaBanner');
      if (!r) { banner.style.display = 'none'; return; }
      banner.style.display = 'flex';
      banner.href = r.url || '#';
      document.getElementById('dashReservaTit').textContent  =
        r.titulo + (r.status === 'pendente' ? ' (aguardando confirmação)' : '');
      document.getElementById('dashReservaMeta').innerHTML =
        `<i class="bi bi-geo-alt"></i> ${escapeHtml(r.sala || '—')}`;
      document.getElementById('dashReservaHora').textContent = r.hora || '—';
      document.getElementById('dashReservaDia').textContent  = r.data || '';
    }

    // ---- Widget Avaliações do grupo (RESPONSAVEL_GRUPO) -------------
    function renderAvaliacoes(av) {
      const row   = document.getElementById('dashRowGestao');
      const panel = document.getElementById('dashAvaliacoes');
      const body  = document.getElementById('dashAvalBody');

      if (!av) { panel.style.display = 'none'; checkDashRowGestao(); return; }

      panel.style.display = 'block';
      row.style.display = 'grid';
      document.getElementById('dashAvalTotal').textContent = av.total || 0;

      if (av.vazio || !av.total) {
        body.innerHTML = `
          <div class="dash-empty">
            <i class="bi bi-star"></i>
            Nenhuma avaliação registrada ainda no grupo.
          </div>`;
        return;
      }

      const cls = av.media >= 8 ? 'bom' : av.media >= 5 ? 'regular' : 'ruim';
      const pPos = Math.round(av.positivas / av.total * 100);
      const pNeu = Math.round(av.neutras   / av.total * 100);
      const pNeg = Math.round(av.negativas / av.total * 100);

      body.innerHTML = `
        <div class="aval-resumo">
          <div class="aval-media-circle ${cls}">
            <span class="num">${av.media}</span>
            <span class="max">/10</span>
          </div>
          <div class="aval-media-info">
            <div class="total"><strong>${av.total}</strong> avaliação(ões) do seu grupo</div>
            <div class="total" style="color:#9CA3AF;font-size:11px;">${av.media_pct}% de satisfação</div>
          </div>
        </div>
        <div class="aval-bar-row">
          <span class="lbl">Positivas</span>
          <div class="aval-bar pos"><div style="width:${pPos}%"></div></div>
          <span class="qtd">${av.positivas}</span>
        </div>
        <div class="aval-bar-row">
          <span class="lbl">Neutras</span>
          <div class="aval-bar neu"><div style="width:${pNeu}%"></div></div>
          <span class="qtd">${av.neutras}</span>
        </div>
        <div class="aval-bar-row">
          <span class="lbl">Negativas</span>
          <div class="aval-bar neg"><div style="width:${pNeg}%"></div></div>
          <span class="qtd">${av.negativas}</span>
        </div>
      `;
    }

    // ---- Widget Frota (RESPONSAVEL_GRUPO do grupo Frotas) -----------
    function renderFrota(f) {
      const row   = document.getElementById('dashRowGestao');
      const panel = document.getElementById('dashFrota');
      const body  = document.getElementById('dashFrotaBody');

      if (!f) { panel.style.display = 'none'; checkDashRowGestao(); return; }

      panel.style.display = 'block';
      row.style.display = 'grid';

      let manutHtml = '';
      if (f.proxima_manutencao) {
        const m = f.proxima_manutencao;
        const urgente = m.dias <= 3 ? 'urgente' : '';
        manutHtml = `
          <div class="frota-prox-manut ${urgente}">
            <i class="bi bi-wrench-adjustable"></i>
            Próxima manutenção: <strong>${escapeHtml(m.placa)}</strong>
            (${escapeHtml(m.tipo)}) — <strong>${escapeHtml(m.label)}</strong>
            <span style="color:#9CA3AF">(${escapeHtml(m.data)})</span>
          </div>`;
      } else {
        manutHtml = `
          <div class="frota-prox-manut" style="background:#F0FDF4;color:#166534">
            <i class="bi bi-check-circle"></i>
            Nenhuma manutenção agendada próxima.
          </div>`;
      }

      body.innerHTML = `
        <div class="frota-mini-grid">
          <div class="frota-mini">
            <div class="v" style="color:${f.checklists_aguardando > 0 ? '#D97706' : '#1A1A1A'}">${f.checklists_aguardando}</div>
            <div class="l">Checklists aguardando</div>
          </div>
          <div class="frota-mini">
            <div class="v" style="color:#2563EB">${f.reservas_hoje}</div>
            <div class="l">Reservas de hoje</div>
          </div>
          <div class="frota-mini">
            <div class="v" style="color:#16A34A">${f.proxima_manutencao ? f.proxima_manutencao.dias : '—'}</div>
            <div class="l">Dias p/ manutenção</div>
          </div>
        </div>
        ${manutHtml}
      `;
    }

    // Esconde a row "gestão" se nenhum dos 2 painéis está visível
    function checkDashRowGestao() {
      const row    = document.getElementById('dashRowGestao');
      const aval   = document.getElementById('dashAvaliacoes');
      const frota  = document.getElementById('dashFrota');
      const algum  = aval.style.display !== 'none' || frota.style.display !== 'none';
      row.style.display = algum ? 'grid' : 'none';
    }
    // [FIM] loadDashboardData()

    // (updateStats removido — KPIs agora vêm do endpoint /api/dashboard/me
    //  e são renderizados em renderKpis() acima.)

    // ====================================
    // FUNÇÃO: Mostrar Erro
    // ====================================
    // [INICIO] showError()
    function showError(title, message) {
      console.error(`[INDEX] ❌ ${title}: ${message}`);

      const loadingPage = document.getElementById("loadingPage");
      if (loadingPage) {
        loadingPage.innerHTML = `
          <div class="loading-error">
            <h3>⚠️ ${title}</h3>
            <p>${message}</p>
            <button onclick="location.href='/SistemaCPE/web/login.html'" class="loading-error-btn">
              🔐 Ir para Login
            </button>
          </div>
        `;
      }
    }
    // [FIM] showError()

    // ====================================
    // TRATAMENTO DE ERROS GLOBAIS
    // ====================================
    // [INICIO] Error Handlers
    window.addEventListener("error", (e) => {
      console.error("[INDEX] 🔴 ERRO GLOBAL:", e.message);
      console.error("[INDEX] Stack:", e.stack);
    });

    window.addEventListener("unhandledrejection", (e) => {
      console.error("[INDEX] 🔴 PROMISE REJECTION:", e.reason);
    });
    // [FIM] Error Handlers

  </script>

</body>

</html>
