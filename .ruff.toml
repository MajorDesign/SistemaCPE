# =====================================================================
# Ruff — configuração CONSERVADORA pra SistemaCPE
# =====================================================================
# Objetivo: pegar bugs REAIS (nome indefinido, import quebrado, sintaxe),
# SEM forçar estilo. Code base ja em produção — qualquer rule cosmética
# vira ruído e atrapalha mais do que ajuda.
#
# Esse arquivo evita que o bug do "NameError: Optional not defined"
# (incidente 2026-06-17) volte a acontecer. Ruff faz análise estática
# e bloqueia o commit antes mesmo do código sair do dev.
# =====================================================================

line-length = 120        # informativo, não vamos enforcement
target-version = "py311"

# Diretórios e arquivos a NÃO analisar
extend-exclude = [
    "server/.venv",
    "server/migrations",          # SQL puro
    "tools/dump_chamados_antigos.py",  # script one-off
    "Chamados antigos",            # dados de teste
    "web",                          # frontend (JS/HTML/CSS)
    ".claude",
    "__pycache__",
]

[lint]
# APENAS pyflakes (F) — detecta nome indefinido, import não usado, sintaxe.
# É EXATAMENTE o conjunto que teria pego o `Optional` faltando.
# Não ativamos E (pycodestyle / PEP8) pra não quebrar com style legado.
select = ["F"]

# Coisas chatas/cosméticas que NÃO queremos bloqueando commit
ignore = [
    "F401",   # 'import X imported but unused' — comum em __init__.py e dev
    "F541",   # f-string sem placeholder — 200+ ocorrências legadas no projeto, NÃO É BUG
    "F811",   # redefined-while-unused — cosmético
    "F841",   # variável local atribuída mas nunca usada (debug code é OK)
]

# Per-file: scripts de tools podem ter pattern menos rigoroso
[lint.per-file-ignores]
"tools/*" = ["F401", "F811"]
"server/app.py" = ["F811"]    # rebind de variável em hot-reload é tolerável aqui

# ---------------------------------------------------------------------
# DÍVIDA TÉCNICA CONHECIDA — F821 (undefined name) legados.
# Bugs REAIS que existem em prod mas precisam de revisão cuidadosa pra
# corrigir (envolvem fluxo de notificações). Ignorados aqui pra não
# bloquear commits — mas DEVEM ser arrumados quando der.
#
# TODO(rastreio): tickets.py:2560 chama criar_notificacao_multipla() que
#   não está importado/definido. Sob o fluxo de resposta de ticket, dá
#   NameError em runtime e quebra a notificação.
#
# TODO(rastreio): notificacao_service.py:128 usa variável `mensagem`
#   nunca atribuída. Sob criação de notificação de ticket, NameError.
# ---------------------------------------------------------------------
"server/routes/tickets.py" = ["F821"]
"server/services/notificacao_service.py" = ["F821"]
"server/services/permissao_service.py" = ["F811"]      # rebind padrão do projeto
"server/services/PermissaoService.py" = ["F811"]       # idem
