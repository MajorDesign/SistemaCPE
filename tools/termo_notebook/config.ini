; ================================================================
; CPE - Termo de Responsabilidade de Notebook
; URL do servidor CPE (FastAPI). Empacotado no EXE como default.
; ================================================================
;
; Se quiser sobrescrever SEM rebuildar o EXE, crie um config.ini
; AO LADO do .exe com esse mesmo conteúdo e ajuste a URL — ele tem
; prioridade sobre este empacotado.
;
; ATENÇÃO: a porta do FastAPI é :8000 (não :1509, que é do Apache).
; ================================================================

[server]
url = http://172.16.0.11:8000
