<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo preto arredondado -->
  <rect width="64" height="64" rx="14" fill="#1A1A1A"/>

  <!-- Faixa amarela accent no rodape (evoca headers dos emails CPE) -->
  <rect x="0" y="54" width="64" height="10" fill="#FFC107"/>

  <!-- "CPE" bold amarelo, letra bem apertada, funciona em 16px -->
  <text x="32" y="40" text-anchor="middle"
        font-family="'Segoe UI', 'Arial Black', Impact, sans-serif"
        font-weight="900" font-size="24" fill="#FFC107"
        letter-spacing="-2">CPE</text>
</svg>
