<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo arredondado preto -->
  <rect width="64" height="64" rx="14" ry="14" fill="#1A1A1A"/>

  <!-- "C" grande em arco (300 graus, deixando abertura à direita) -->
  <path d="M 46 20 A 16 16 0 1 0 46 44"
        fill="none" stroke="#FFC107" stroke-width="7" stroke-linecap="round"/>

  <!-- "Control point" (dot amarelo dentro da abertura do C) -->
  <circle cx="46" cy="32" r="4" fill="#FFC107"/>
</svg>
