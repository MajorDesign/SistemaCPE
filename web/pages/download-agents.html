<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/SistemaCPE/web/favicon.svg?v=2026-07-02b">
  <title>Download de Agentes - CPE Control</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="/SistemaCPE/web/assests/css/global.css">
  <link rel="stylesheet" href="/SistemaCPE/web/assests/css/layout.css">
  <link rel="stylesheet" href="/SistemaCPE/web/assests/css/components.css">
  <script src="/SistemaCPE/web/assests/js/config.js"></script>
  <script src="/SistemaCPE/web/assests/js/page-guard.js?v=2026-08-24-fetch-auth"></script>
  <script>pageGuard('DOWNLOAD_AGENTS');</script>
  <style>
    .agent-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
      margin-bottom: 16px;
    }
    .agent-header { display:flex; align-items:flex-start; gap:16px; margin-bottom:14px; }
    .agent-icon-wrap {
      width:56px; height:56px; border-radius:12px; flex-shrink:0;
      background:linear-gradient(135deg,#FFC107 0%,#F59E0B 100%);
      color:#1f2937; display:flex; align-items:center; justify-content:center; font-size:28px;
    }
    .agent-title { font-size:1.1rem; font-weight:700; color:#1f2937; margin:0 0 4px; }
    .agent-desc  { font-size:13px; color:#6b7280; margin:0 0 6px; line-height:1.45; }
    .agent-systems .badge-sys {
      display:inline-block; font-size:11px; background:#F3F4F6; color:#374151;
      border:1px solid #E5E7EB; padding:2px 8px; border-radius:10px; margin:2px 4px 2px 0;
    }
    .agent-updated { font-size:11px; color:#9CA3AF; margin-top:4px; }
    .agent-version-badge {
      display:inline-block; background:#1f2937; color:#FFC107;
      font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px;
      letter-spacing:.5px; margin-left:8px; vertical-align:middle;
    }
    .agent-files {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
      gap:10px; margin-top:10px;
    }
    .agent-file-card {
      border:1px solid #E5E7EB; border-radius:10px; padding:10px 12px;
      display:flex; align-items:center; gap:10px;
    }
    .agent-file-icon {
      width:38px; height:38px; border-radius:8px; display:flex; align-items:center;
      justify-content:center; font-size:18px; flex-shrink:0;
    }
    .agent-file-icon.exe { background:#DBEAFE; color:#1D4ED8; }
    .agent-file-icon.zip { background:#FEF3C7; color:#B45309; }
    .agent-file-icon.src { background:#DCFCE7; color:#166534; }
    .agent-file-info  { flex:1; min-width:0; }
    .agent-file-label { font-size:12px; font-weight:600; color:#1f2937; }
    .agent-file-meta  { font-size:10px; color:#9CA3AF; }
    .btn-dl {
      background:#FFC107; color:#1f2937; border:none; border-radius:6px;
      padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer;
      display:inline-flex; align-items:center; gap:4px; text-decoration:none;
    }
    .btn-dl:hover { background:#F59E0B; color:#1f2937; }
    .btn-dl:disabled { opacity:.5; cursor:not-allowed; }

    .stats-grid {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:16px; margin-bottom:20px;
    }
    .stat-card {
      background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:16px;
    }
    .stat-label { font-size:12px; color:#6b7280; font-weight:600; text-transform:uppercase; margin-bottom:6px; }
    .stat-value { font-size:26px; font-weight:700; color:#1f2937; }
    .stat-change{ font-size:12px; color:#6b7280; margin-top:4px; }

    .empty-state { text-align:center; padding:40px; color:#6b7280; }
    .empty-state i { font-size:48px; opacity:.3; display:block; margin-bottom:12px; }
  </style>
</head>

<body>

  <!-- Navbar padrão -->
  <div id="navbar-container"></div>

  <div class="container-main">
    <!-- Sidebar padrão -->
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div class="top-bar">
        <h1><i class="bi bi-download"></i> Download de Agentes</h1>
      </div>

      <div class="content">
        <div class="alert alert-danger d-none" id="alertBox" role="alert">
          <i class="bi bi-exclamation-circle"></i> <span id="alertMessage"></span>
        </div>

        <div class="page-header" style="display:flex;justify-content:flex-end;align-items:center;margin-bottom:16px">
          <button class="btn btn-primary" onclick="loadAgents()">
            <i class="bi bi-arrow-clockwise"></i> Atualizar
          </button>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Total de Agentes</div>
            <div class="stat-value" id="totalAgents">—</div>
            <div class="stat-change">Disponíveis para download</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Versão mais recente</div>
            <div class="stat-value" id="latestVersion">—</div>
            <div class="stat-change" id="latestVersionAgent">—</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Atualização mais recente</div>
            <div class="stat-value" id="latestDate" style="font-size:18px">—</div>
            <div class="stat-change" id="latestDateRel">—</div>
          </div>
        </div>

        <div id="agentsList">
          <div class="empty-state">
            <i class="bi bi-hourglass-split"></i>
            <p>Carregando agentes...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/SistemaCPE/web/assests/js/config.js"></script>
  <script src="/SistemaCPE/web/assests/js/nav.js?v=2026-07-28"></script>

  <script>
    const API = (typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : `http://${window.location.hostname||'127.0.0.1'}:8000`) + '/api/agents';

    function _token() {
      return localStorage.getItem('cpe_token') || sessionStorage.getItem('cpe_token') || '';
    }
    async function apiFetch(path) {
      const res = await fetch(API + path, {
        credentials:'include',
        headers: { 'X-Auth-Token': _token() },
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }
    function fmtBytes(b) {
      if (!b) return '—';
      if (b < 1024) return b + ' B';
      if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
      return (b/(1024*1024)).toFixed(2) + ' MB';
    }
    function fmtDate(iso) {
      if (!iso) return '—';
      try { return new Date(iso).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
      catch { return iso; }
    }
    function relDate(iso) {
      if (!iso) return '';
      const diff = (Date.now() - new Date(iso).getTime()) / 1000;
      if (diff < 60)     return 'agora mesmo';
      if (diff < 3600)   return Math.floor(diff/60) + ' min atrás';
      if (diff < 86400)  return Math.floor(diff/3600) + ' h atrás';
      const days = Math.floor(diff/86400);
      if (days === 1) return 'ontem';
      if (days < 30)  return days + ' dias atrás';
      return fmtDate(iso);
    }

    async function loadAgents() {
      const list = document.getElementById('agentsList');
      list.innerHTML = '<div class="empty-state"><i class="bi bi-hourglass-split"></i><p>Carregando...</p></div>';
      try {
        const data = await apiFetch('');
        const agents = data.agents || [];
        document.getElementById('totalAgents').textContent = agents.length;

        let maisRecente = null;
        let maisNovoAgent = null;
        agents.forEach(a => {
          if (a.last_updated && (!maisRecente || a.last_updated > maisRecente)) {
            maisRecente = a.last_updated;
            maisNovoAgent = a;
          }
        });
        document.getElementById('latestDate').textContent = maisRecente ? fmtDate(maisRecente) : '—';
        document.getElementById('latestDateRel').textContent = maisRecente ? relDate(maisRecente) : '—';
        document.getElementById('latestVersion').textContent = maisNovoAgent?.version ? 'v' + maisNovoAgent.version : '—';
        document.getElementById('latestVersionAgent').textContent = maisNovoAgent ? maisNovoAgent.name : '—';

        if (!agents.length) {
          list.innerHTML = '<div class="empty-state"><i class="bi bi-inbox"></i><p>Nenhum agente disponível.</p></div>';
          return;
        }

        list.innerHTML = agents.map(a => {
          const systems = (a.systems||[]).map(s => '<span class="badge-sys">'+s+'</span>').join('');
          const autoUpdateBadge = a.auto_update
            ? '<span style="font-size:11px;background:#d1fae5;color:#065f46;border:1px solid #6ee7b7;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle"><i class="bi bi-arrow-repeat"></i> Auto-atualizável</span>'
            : '';
          const files = Object.entries(a.files||{}).map(([key, f]) => {
            const iconCls = key === 'exe' ? 'exe' : (key === 'zip' ? 'zip' : 'src');
            const iconBi  = key === 'exe' ? 'bi-windows'
                          : key === 'zip' ? 'bi-file-zip'
                          : key === 'bat' ? 'bi-terminal'
                          : 'bi-file-earmark-code';
            const disabled = !f.available;
            const url = API + '/' + a.id + '/download?format=' + key;
            const meta = f.available
              ? fmtBytes(f.size_bytes) + ' · ' + relDate(f.modified)
              : 'Indisponível';
            const btn = disabled
              ? '<button class="btn-dl" disabled><i class="bi bi-x-circle"></i> Indisponível</button>'
              : '<a class="btn-dl" href="'+url+'" target="_blank" rel="noopener"><i class="bi bi-download"></i> Baixar</a>';
            return `
              <div class="agent-file-card">
                <div class="agent-file-icon ${iconCls}"><i class="bi ${iconBi}"></i></div>
                <div class="agent-file-info">
                  <div class="agent-file-label">${f.label}</div>
                  <div class="agent-file-meta">${meta}</div>
                </div>
                ${btn}
              </div>`;
          }).join('');

          const versionBadge = a.version ? `<span class="agent-version-badge">v${a.version}</span>` : '';
          return `
            <div class="agent-card">
              <div class="agent-header">
                <div class="agent-icon-wrap"><i class="bi ${a.icon||'bi-box'}"></i></div>
                <div style="flex:1;min-width:0">
                  <h3 class="agent-title">${a.name}${versionBadge}${autoUpdateBadge}</h3>
                  <p class="agent-desc">${a.description||''}</p>
                  <div class="agent-systems">${systems}</div>
                  <div class="agent-updated">Atualizado: ${a.last_updated ? relDate(a.last_updated) : '—'}</div>
                </div>
              </div>
              <div class="agent-files">${files}</div>
            </div>`;
        }).join('');
      } catch (err) {
        list.innerHTML = '<div class="empty-state"><i class="bi bi-exclamation-triangle"></i><p>Erro ao carregar: '+err.message+'</p></div>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadAgents);
  </script>
</body>
</html>
