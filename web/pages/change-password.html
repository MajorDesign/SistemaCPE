<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/SistemaCPE/web/favicon.svg?v=2026-07-02b">
  <title>Trocar senha — CPE Control</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/SistemaCPE/web/assests/css/layout.css?v=2026-08-25-shimmer-v4">
  <script src="/SistemaCPE/web/assests/js/config.js"></script>
  <style>
    body { background: #1A1A1A; min-height: 100vh;
           display: flex; align-items: center; justify-content: center;
           padding: 24px; font-family: 'Inter', system-ui, sans-serif; }
    .cp-box {
      background: #fff; border-radius: 16px;
      max-width: 460px; width: 100%;
      box-shadow: 0 18px 50px rgba(0,0,0,.4);
      overflow: hidden;
    }
    .cp-header {
      background: linear-gradient(135deg, #FFC107, #F59E0B);
      color: #1A1A1A; padding: 20px 24px;
    }
    .cp-header h2 {
      margin: 0; font-size: 1.3rem; font-weight: 700;
      display: flex; align-items: center; gap: 8px;
    }
    .cp-header p { margin: 4px 0 0; font-size: .85rem; opacity: .85; }
    .cp-body { padding: 24px; }
    .cp-alert {
      background: #FEF3C7; border-left: 4px solid #F59E0B;
      color: #92400E; padding: 12px 14px; border-radius: 8px;
      font-size: .88rem; margin-bottom: 18px;
    }
    .cp-field { margin-bottom: 16px; }
    .cp-field label { font-weight: 600; font-size: .88rem; }
    .cp-error { color: #B91C1C; background: #FEE2E2; padding: 10px;
                border-radius: 8px; font-size: .85rem; margin-bottom: 12px; display: none; }
    .cp-btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: #1A1A1A; color: #FFC107; font-weight: 700;
      cursor: pointer; font-size: 1rem;
    }
    .cp-btn:hover { filter: brightness(1.1); }
    .cp-btn:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="cp-box">
  <div class="cp-header">
    <h2><i class="bi bi-key-fill"></i> Defina uma nova senha</h2>
    <p id="cpHello">—</p>
  </div>
  <div class="cp-body">
    <div class="cp-alert">
      <i class="bi bi-shield-exclamation"></i> <strong>Sua senha foi resetada por um administrador.</strong><br>
      Por segurança, você precisa definir uma senha pessoal antes de continuar.
    </div>

    <div class="cp-error" id="cpError"></div>

    <div class="cp-field">
      <label for="novaSenha">Nova senha</label>
      <input type="password" class="form-control" id="novaSenha" autofocus
             placeholder="Mínimo 8 caracteres" minlength="8">
    </div>
    <div class="cp-field">
      <label for="confirmar">Confirmar nova senha</label>
      <input type="password" class="form-control" id="confirmar"
             placeholder="Repita a senha">
    </div>

    <button class="cp-btn" id="btnSalvar" onclick="salvar()">
      <i class="bi bi-check-lg"></i> Salvar nova senha e continuar
    </button>
  </div>
</div>

<script>
(function () {
  const u = JSON.parse(localStorage.getItem('cpe_user') || sessionStorage.getItem('cpe_user') || '{}');
  if (!u.id) {
    // sem sessão — manda pro login
    window.location.href = '/SistemaCPE/web/login.html';
    return;
  }
  document.getElementById('cpHello').textContent = `Olá, ${u.name || u.email || 'usuário'}.`;

  window.salvar = async function () {
    const errEl = document.getElementById('cpError');
    errEl.style.display = 'none';
    const senha = document.getElementById('novaSenha').value;
    const conf  = document.getElementById('confirmar').value;
    if (!senha || senha.length < 8) {
      errEl.textContent = 'A senha precisa ter no mínimo 8 caracteres.';
      errEl.style.display = 'block'; return;
    }
    if (senha !== conf) {
      errEl.textContent = 'As senhas não coincidem.';
      errEl.style.display = 'block'; return;
    }

    const btn = document.getElementById('btnSalvar');
    btn.disabled = true; btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Salvando...';

    try {
      const token = localStorage.getItem('cpe_token') || sessionStorage.getItem('cpe_token') || '';
      const res = await fetch(`${API_BASE_URL}/api/users/${u.id}/senha`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json', 'X-Auth-Token': token },
        // self com must_change_password=1 nao precisa de senha_atual; backend reconhece
        body: JSON.stringify({ senha_nova: senha }),
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) {
        errEl.textContent = d.detail || `Erro ${res.status}`;
        errEl.style.display = 'block';
        btn.disabled = false; btn.innerHTML = '<i class="bi bi-check-lg"></i> Salvar nova senha e continuar';
        return;
      }
      sessionStorage.removeItem('mustChangePassword');
      const redirect = sessionStorage.getItem('redirectAfterLogin') || '/SistemaCPE/index.html';
      sessionStorage.removeItem('redirectAfterLogin');
      alert('✅ Senha atualizada com sucesso. Você será redirecionado.');
      window.location.href = redirect;
    } catch (err) {
      errEl.textContent = 'Erro de conexão: ' + err.message;
      errEl.style.display = 'block';
      btn.disabled = false; btn.innerHTML = '<i class="bi bi-check-lg"></i> Salvar nova senha e continuar';
    }
  };
})();
</script>

</body>
</html>
